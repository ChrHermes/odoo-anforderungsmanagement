# Isolated synthetic data only. No ports, no production mounts or SMTP config.
# Enterprise acceptance: replace /test-contracts with a licensed Enterprise path.
services:
  db:
    image: postgres:17@sha256:0b657ff48d7f76a1e907f381b1693eb4f2bf54c1d2df4feb6743d7dc601768dd
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  odoo:
    image: odoo:20.0@sha256:61e3c71b0503c5f658e604c3e340bede20b97d05f726179fa006eae50a32fd23
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: isolated-test-only
    volumes:
      - ./addons:/mnt/extra-addons:ro
      - ./.local/contract-addons:/test-contracts:ro
      - odoo-data:/var/lib/odoo
    command: ["odoo", "--addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/test-contracts", "--db_host=db", "--db_user=odoo", "--db_password=isolated-test-only", "-d", "gc_requirements_contract", "-i", "gc_requirements", "--test-enable", "--test-tags", "/gc_requirements", "--stop-after-init", "--without-demo=all", "--http-port=0"]
networks:
  default:
    internal: true
volumes:
  odoo-data:
