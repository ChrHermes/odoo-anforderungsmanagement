# Interactive local development ONLY. Prepare/start with: python3 scripts/dev.py start
name: gc-requirements-dev
services:
  db:
    image: postgres:15-alpine@sha256:09e4f20b14ddb3dfe3a0c825b206032aaf8f28300ba2070c0b60fc1c10c6abc7
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 2s
      timeout: 3s
      retries: 30
  odoo:
    image: odoo:18.0@sha256:1b346c6f9145c79b802b711a554a141acbd0503ed6cd7d31cb3c938889c4cc36
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["odoo"]
    command: ["--config=/etc/odoo/dev.conf", "--dev=reload,qweb"]
    volumes:
      - ./addons:/mnt/extra-addons:ro
      - ./.local/dev/addons:/mnt/local-addons:ro
      # In Enterprise mode this is replaced by the selected licensed directory.
      - type: bind
        source: ${GC_ENTERPRISE_PATH:-./.local/dev/empty-enterprise}
        target: /mnt/enterprise
        read_only: true
        bind:
          create_host_path: false
      - ./.local/dev/odoo.conf:/etc/odoo/dev.conf:ro
      - ./.local/dev/credentials.json:/run/local-dev/credentials.json:ro
      - ./scripts:/opt/local-dev:ro
      - odoo-data:/var/lib/odoo
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=10)"]
      interval: 5s
      timeout: 15s
      retries: 40
      start_period: 20s
  web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - ./dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - browser
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8069/web/login"]
      interval: 5s
      timeout: 15s
      retries: 20
networks:
  default:
    internal: true
  browser:
volumes:
  postgres-data:
  odoo-data:
secrets:
  postgres_password:
    file: ./.local/dev/postgres-password
