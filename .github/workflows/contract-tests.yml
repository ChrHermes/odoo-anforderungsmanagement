name: Odoo 18 Community contract (not Enterprise acceptance)
on:
  push:
    branches: [codex/initial-mvp]
    paths: ["addons/**", "scripts/**", "tests/**", "compose.test.yaml", ".github/workflows/**", "ruff.toml"]
  pull_request:
    paths: ["addons/**", "scripts/**", "tests/**", "compose.test.yaml", ".github/workflows/**", "ruff.toml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Fresh install, ORM tests, upgrade and preservation
        run: python3 scripts/test_contract.py
